<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Message received — NavWeb Co</title>
  <meta name="description" content="Your message has been received by NavWeb Co." />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config (MATCHES SITE) -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          colors: {
            pageBg: '#F4F3EE',
            accent: '#9FB8AE',
            accentHover: '#8EA79C',
            textMain: '#2F2F2F',
            textMuted: '#6B6B6B',
            borderSoft: '#D6D6D0',
            darkBg: '#0F0F0F',
            darkCard: '#1A1A1A'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-pageBg dark:bg-darkCard text-textMain dark:text-gray-300 font-sans antialiased">

<section class="min-h-screen flex items-center justify-center px-6">
  <div
    class="w-full max-w-md
           rounded-2xl p-8
           bg-white/70 dark:bg-darkCard
           border border-borderSoft dark:border-white/5
           text-center
           transition-all duration-500">

    <!-- STATUS -->
    <div class="flex justify-center mb-6">
      <span class="inline-flex items-center justify-center
                   w-10 h-10 rounded-full
                   bg-accent text-textMain">
        ✓
      </span>
    </div>

    <h1 class="text-lg font-semibold leading-snug">
      Message received
    </h1>

    <p class="mt-3 text-sm text-textMuted dark:text-gray-400">
      Thanks — your message is safely received.
      We’ll review it and get back to you within one working day.
    </p>

    <!-- CTA -->
    <div class="mt-8 flex flex-col gap-3">
      <a
        href="https://wa.me/919999999999?text=Hi%20NavWeb%2C%20following%20up%20on%20my%20enquiry."
        target="_blank"
        class="inline-flex items-center justify-center
               rounded-lg px-5 py-2.5
               bg-accent text-textMain
               transition-all duration-300 ease-out
               hover:-translate-y-[1px] hover:shadow-md
               hover:bg-accentHover">
        Continue on WhatsApp
      </a>

      <a
        href="/#home"
        class="text-xs text-textMuted dark:text-gray-400">
        ← Back to home
      </a>
    </div>

  </div>
</section>

<script src="./main.js" defer></script>

</body>
</html>
